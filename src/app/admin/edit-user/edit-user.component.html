<div class="page fade-in">
  <div class="page-header">
    <div>
      <h1 class="page-title">Modifier Un Utilisateur</h1>
      <p>Mettez à jour les informations et le rôle</p>
    </div>
    <a class="btn btn-outline btn-sm" routerLink="/admin/users">
      <span class="material-icons" style="font-size:16px">arrow_back</span> Retour
    </a>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg" style="margin-bottom:16px;">
    <span class="material-icons">error</span> {{ errorMsg }}
  </div>
  <div class="alert alert-success" *ngIf="successMsg" style="margin-bottom:16px;">
    <span class="material-icons">check_circle</span> {{ successMsg }}
  </div>

  <app-loading-spinner [isLoading]="isLoading" message="Chargement de l'utilisateur..."></app-loading-spinner>

  <div class="card" style="max-width:760px;" *ngIf="!isLoading">
    <form (ngSubmit)="save()" #f="ngForm">
      <div class="grid-2">
        <div class="form-group">
          <label>Nom</label>
          <input [(ngModel)]="user.nom" name="nom" placeholder="Nom" required>
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input [(ngModel)]="user.prenom" name="prenom" placeholder="Prénom" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="user.email" name="email" type="email" placeholder="Email" required>
      </div>

      <div class="form-group" style="max-width:320px;">
        <label>Rôle</label>
        <select [(ngModel)]="user.role" name="role" required>
          <option value="medecin">Médecin</option>
          <option value="patient">Patient</option>
          <option value="infirmier">Infirmier</option>
          <option value="laboratoire">Laboratoire</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="flex gap-12" style="margin-top:8px;">
        <button class="btn btn-primary" type="submit" [disabled]="!f.valid || isLoading">
          <span class="material-icons" style="font-size:16px">save</span> Sauvegarder
        </button>
        <a class="btn btn-outline" routerLink="/admin/users">Annuler</a>
      </div>
    </form>
  </div>
</div>
