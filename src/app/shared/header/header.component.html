<section class="header glass">
  <!-- Left: breadcrumb / page title -->
  <div class="header-left">
    <button class="menu-btn" (click)="toggleMenu()" title="Toggle sidebar" aria-label="Ouvrir/fermer le menu">
      <span class="material-icons-round" aria-hidden="true">menu</span>
    </button>
    <div class="header-title-area">
      <app-breadcrumb></app-breadcrumb>
      <span class="page-label">{{ pageTitle }}</span>
    </div>
  </div>

  <!-- Right: theme · clock · user -->
  <div class="header-right">

    <!-- Theme Toggle -->
    <button class="icon-btn theme-toggle" 
      (click)="toggleTheme()"
      type="button"
      [title]="'Passer en mode ' + (currentTheme === 'dark' ? 'clair' : 'sombre')"
      [attr.aria-label]="'Passer en mode ' + (currentTheme === 'dark' ? 'clair' : 'sombre')">
      <span class="material-icons-round theme-icon" aria-hidden="true">{{ currentTheme === 'dark' ? 'light_mode' : 'dark_mode' }}</span>
    </button>

    <!-- Clock & Calendar -->
    <div class="clock-wrapper">
      <button class="h-clock" 
        (click)="toggleCalendar($event)" 
        [class.active]="showCalendar"
        type="button"
        aria-label="Date et heure actuelles - Cliquer pour ouvrir le calendrier">
        <span class="material-icons-round" aria-hidden="true">schedule</span>
        <div class="h-clock-info">
          <span class="h-clock-date">{{ currentDate }}</span>
          <span class="h-clock-time">{{ currentTime }}</span>
        </div>
      </button>
      
      <!-- Calendar Dropdown -->
      <section class="calendar-dropdown" 
        *ngIf="showCalendar" 
        (click)="$event.stopPropagation()"
        (keydown.escape)="showCalendar = false"
        aria-label="Calendrier">
        <div class="calendar-header">
          <button class="cal-nav-btn" (click)="previousMonth()" aria-label="Mois précédent">
            <span class="material-icons-round">chevron_left</span>
          </button>
          <span class="cal-month-year">{{ monthYear }}</span>
          <button class="cal-nav-btn" (click)="nextMonth()" aria-label="Mois suivant">
            <span class="material-icons-round">chevron_right</span>
          </button>
        </div>
        
        <div class="calendar-weekdays">
          <span>L</span>
          <span>M</span>
          <span>M</span>
          <span>J</span>
          <span>V</span>
          <span>S</span>
          <span>D</span>
        </div>
        
        <div class="calendar-days">
          <div *ngFor="let day of calendarDays" 
            class="cal-day" 
            [class.other-month]="!day.isCurrentMonth"
            [class.today]="day.isToday">
            {{ day.dayNumber }}
          </div>
        </div>
      </section>
    </div>

    <!-- User -->
    <div class="h-user">
      <div class="h-avatar" aria-hidden="true">{{ userInitial }}</div>
      <div class="h-user-info">
        <span class="h-user-name">{{ userName }}</span>
        <span class="h-user-role">{{ userRole }}</span>
      </div>
    </div>

  </div>
</section>
