<div class="register-page">
	<div class="register-card card">
		<div class="register-head">
			<h2>Creer Votre Compte</h2>
			<p>Accedez a votre espace DME securise.</p>
		</div>

		<div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>
		<div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>

		<div class="grid-2">
			<div class="form-group">
				<label>Nom</label>
				<input type="text" [(ngModel)]="nom" placeholder="Nom" />
			</div>

			<div class="form-group">
				<label>Prenom</label>
				<input type="text" [(ngModel)]="prenom" placeholder="Prenom" />
			</div>
		</div>

		<div class="form-group">
			<label>Email</label>
			<input type="email" [(ngModel)]="email" placeholder="email@exemple.com" />
		</div>

		<div class="form-group">
			<label>Mot de passe</label>
			<input type="password" [(ngModel)]="motDePasse" placeholder="********" />
		</div>

		<div class="form-group">
			<label>Role</label>
			<select [(ngModel)]="role">
				<option *ngFor="let r of roles" [ngValue]="r">{{ r | titlecase }}</option>
			</select>
		</div>

		<button class="btn btn-primary register-btn" (click)="register()" [disabled]="isLoading">
			{{ isLoading ? 'Creation...' : 'Creer Le Compte' }}
		</button>

		<p class="register-foot">
			Vous avez deja un compte ?
			<a routerLink="/login">Se connecter</a>
		</p>
	</div>
</div>
