<div class="auth-page">
  <div class="auth-card card fade-in">

    <div class="auth-head">
      <div class="auth-icon">
        <span class="material-icons-round">lock_reset</span>
      </div>
      <h2>Mot de passe oublié</h2>
      <p>Entrez votre email pour recevoir un lien de réinitialisation.</p>
    </div>

    <!-- Success state -->
    <div *ngIf="emailSent" class="auth-success">
      <span class="material-icons-round success-ico">check_circle</span>
      <p class="success-msg">{{ message }}</p>
      <p class="info-msg">Vérifiez votre boîte de réception et suivez les instructions.</p>
      <button class="btn btn-primary w-full mt-12" (click)="goToLogin()">
        <span class="material-icons-round">login</span>
        Retour à la connexion
      </button>
    </div>

    <!-- Form state -->
    <div *ngIf="!emailSent">
      <div class="alert alert-danger" *ngIf="error" style="margin-bottom:16px">
        <span class="material-icons-round" style="font-size:18px">warning</span>
        {{ error }}
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <div class="input-wrap">
          <span class="material-icons-round input-icon">email</span>
          <input id="email" type="email" [(ngModel)]="email" placeholder="votre@email.com" (keyup.enter)="submit()">
        </div>
      </div>

      <button class="btn btn-primary w-full" (click)="submit()" [disabled]="loading">
        <span class="spinner-inline" *ngIf="loading"></span>
        <span class="material-icons-round" *ngIf="!loading">send</span>
        {{ loading ? 'Envoi...' : 'Envoyer le lien' }}
      </button>

      <button class="btn btn-outline w-full" style="margin-top:10px" (click)="goToLogin()">
        <span class="material-icons-round">arrow_back</span>
        Retour à la connexion
      </button>
    </div>

  </div>
</div>
