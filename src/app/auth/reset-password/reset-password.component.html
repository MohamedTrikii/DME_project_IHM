<div class="auth-page">
  <div class="auth-card card fade-in">

    <div class="auth-head">
      <div class="auth-icon">
        <span class="material-icons-round">lock_reset</span>
      </div>
      <h2>Réinitialiser le mot de passe</h2>
      <p>Entrez et confirmez votre nouveau mot de passe.</p>
    </div>

    <!-- Invalid token -->
    <div *ngIf="!token" class="auth-error">
      <span class="material-icons-round error-ico">error_outline</span>
      <p class="error-msg">{{ error }}</p>
      <button class="btn btn-primary w-full mt-12" (click)="goToLogin()">
        <span class="material-icons-round">login</span>
        Retour à la connexion
      </button>
    </div>

    <!-- Success -->
    <div *ngIf="resetSuccess" class="auth-success">
      <span class="material-icons-round success-ico">check_circle</span>
      <p class="success-msg">{{ message }}</p>
      <p class="info-msg">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
      <button class="btn btn-primary w-full mt-12" (click)="goToLogin()">
        <span class="material-icons-round">login</span>
        Se connecter
      </button>
    </div>

    <!-- Form -->
    <div *ngIf="!resetSuccess && token">
      <div class="alert alert-danger" *ngIf="error" style="margin-bottom:16px">
        <span class="material-icons-round" style="font-size:18px">warning</span>
        {{ error }}
      </div>

      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <div class="input-wrap">
          <span class="material-icons-round input-icon">lock</span>
          <input id="password" type="password" [(ngModel)]="password" placeholder="Minimum 6 caractères">
        </div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirmer le mot de passe</label>
        <div class="input-wrap">
          <span class="material-icons-round input-icon">lock_outline</span>
          <input id="confirm" type="password" [(ngModel)]="confirmPassword" placeholder="Confirmez votre mot de passe" (keyup.enter)="submit()">
        </div>
      </div>

      <button class="btn btn-primary w-full" (click)="submit()" [disabled]="loading">
        <span class="spinner-inline" *ngIf="loading"></span>
        <span class="material-icons-round" *ngIf="!loading">lock_reset</span>
        {{ loading ? 'En cours...' : 'Réinitialiser' }}
      </button>

      <button class="btn btn-outline w-full" style="margin-top:10px" (click)="goToLogin()">
        <span class="material-icons-round">arrow_back</span>
        Retour à la connexion
      </button>
    </div>

  </div>
</div>
