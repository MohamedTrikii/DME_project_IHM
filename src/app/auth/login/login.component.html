<!-- ══ LOGIN PAGE — Split-screen animée ══ -->
<div class="login-page">

  <!-- Left Panel: Animated background -->
  <div class="login-left">
    <div class="left-content">
      <div class="brand">
        <div class="brand-icon">
          <span class="material-icons-round">local_hospital</span>
        </div>
        <h1>DME Platform</h1>
      </div>
      <p class="left-tagline">Dossier Médical Électronique<br>Sécurisé · Intelligent · Intégré</p>
      <div class="feature-list">
        <div class="feature-item" *ngFor="let f of features; let i = index" [style.animation-delay]="(i*100)+'ms'">
          <span class="material-icons-round">{{ f.icon }}</span>
          <span>{{ f.text }}</span>
        </div>
      </div>
      <!-- Floating medical particles -->
      <div class="particles">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
      </div>
    </div>
  </div>

  <!-- Right Panel: Login Form -->
  <div class="login-right">
    <div class="login-form-wrap">

      <!-- Header -->
      <div class="form-header">
        <h2>Bienvenue 👋</h2>
        <p>Connectez-vous à votre espace personnel</p>
      </div>

      <!-- Role Tabs -->
      <div class="role-tabs">
        <button class="role-tab" *ngFor="let r of roles" [class.active]="role === r.key" (click)="setRole(r.key)">
          <span class="material-icons-round">{{ r.icon }}</span>
          <span>{{ r.label }}</span>
        </button>
      </div>

      <!-- Error -->
      <div class="alert alert-danger" *ngIf="errorMsg" style="margin-bottom:16px;">
        <span class="material-icons-round" style="font-size:18px">warning</span>
        {{ errorMsg }}
      </div>

      <!-- Form Fields -->
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <div class="input-wrap">
          <span class="material-icons-round input-icon">email</span>
          <input id="email" type="email" [(ngModel)]="email" placeholder="exemple@email.com" (keyup.enter)="login()">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrap">
          <span class="material-icons-round input-icon">lock</span>
          <input id="password" [type]="showPwd ? 'text' : 'password'" [(ngModel)]="password" placeholder="••••••••"
            (keyup.enter)="login()">
          <button class="pwd-toggle" (click)="showPwd = !showPwd">
            <span class="material-icons-round">{{ showPwd ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" [(ngModel)]="remember"> Se souvenir de moi
        </label>
        <a routerLink="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
      </div>

      <!-- Submit -->
      <button class="btn-login" (click)="login()" [class.loading]="isLoading">
        <span class="material-icons-round" *ngIf="!isLoading">login</span>
        <div class="spinner" *ngIf="isLoading"></div>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <!-- Footer link -->
      <p class="form-footer">
        Pas encore de compte ?
        <a routerLink="/register">Créer un compte</a>
      </p>

    </div>
  </div>
</div>
