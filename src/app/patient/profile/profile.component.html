<div class="page fade-in">

  <div class="page-header">
    <div>
      <h1 class="page-title">Mon Profil</h1>
      <p>Informations personnelles</p>
    </div>
    <button class="btn btn-outline btn-sm" (click)="loadProfile()">
      <span class="material-icons" style="font-size:16px">refresh</span> Actualiser
    </button>
  </div>

  <div class="alert alert-danger" *ngIf="error" style="margin-bottom:20px;">
    <span class="material-icons">error</span> {{ error }}
  </div>

  <app-loading-spinner [isLoading]="loading" message="Chargement du profil..."></app-loading-spinner>

  <div class="card" style="max-width:560px;" *ngIf="!loading && !error">

    <!-- Avatar + Name -->
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);">
      <div class="mini-avatar"
           style="width:60px;height:60px;font-size:1.5rem;border-radius:50%;background:var(--primary-glow);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;">
        {{ (patient.prenom || 'P').charAt(0) }}{{ (patient.nom || '').charAt(0) }}
      </div>
      <div>
        <h3 style="margin:0;font-size:1.2rem;">{{ patient.prenom }} {{ patient.nom }}</h3>
        <span class="badge badge-success" style="margin-top:6px;display:inline-flex;">Patient</span>
      </div>
    </div>

    <!-- Info grid -->
    <div class="grid-2" style="gap:20px;">
      <div>
        <label style="font-size:.78rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:.05em;">
          Nom complet
        </label>
        <p style="margin:4px 0 0;font-weight:600;">{{ patient.nom || '—' }} {{ patient.prenom || '' }}</p>
      </div>
      <div>
        <label style="font-size:.78rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:.05em;">
          Email
        </label>
        <p style="margin:4px 0 0;">{{ patient.email || '—' }}</p>
      </div>
    </div>

  </div>

</div>
