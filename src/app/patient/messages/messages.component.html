<div class="page fade-in">
  <div class="page-header">
    <div>
      <h1 class="page-title">Messages</h1>
      <p>Conversation avec vos soignants</p>
    </div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    
    <div style="padding:16px 20px;border-bottom:1px solid var(--border-color);font-weight:600;">
      Fil de discussion
    </div>


    <!-- Sélecteur de destinataire (médecin) -->
    <div class="contacts-bar" style="padding: 16px 20px; border-bottom: 1px solid var(--border-color);">
      <label for="contact-select">Choisir un médecin :</label>
      <select id="contact-select" [(ngModel)]="selectedContact" (ngModelChange)="selectContact($event)" [disabled]="loading || !contacts.length">
        <option [ngValue]="null">-- Sélectionner --</option>
        <option *ngFor="let c of contacts" [ngValue]="c">
          {{ c.nom }} {{ c.prenom }}
        </option>
      </select>
    </div>

    <div *ngIf="selectedContact">
      <div class="chat-container">
        <div *ngFor="let msg of messages" 
             class="msg" 
             [ngClass]="msg.from === 'Moi' ? 'me' : 'other'">
          <div class="bubble">
            <div class="sender">{{ msg.from }}</div>
            <div class="text">{{ msg.text }}</div>
          </div>
        </div>
      </div>

      <div class="input-box">
        <input [(ngModel)]="newMsg" placeholder="Écrire un message..." />
        <button class="btn btn-primary" (click)="send()" [disabled]="!newMsg.trim()">
          Envoyer
        </button>
      </div>
    </div>
    <div *ngIf="!selectedContact && contacts.length" class="no-contact-msg" style="padding: 16px;">
      <p>Sélectionnez un médecin pour commencer une discussion.</p>
    </div>
    <div *ngIf="loading" class="loading-msg" style="padding: 16px;">Chargement...</div>
    <div *ngIf="error" class="error-msg" style="padding: 16px; color: red;">{{ error }}</div>

  </div>
</div>
