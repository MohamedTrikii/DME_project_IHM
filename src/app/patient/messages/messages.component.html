<div class="page fade-in">
  <div class="page-header">
    <div>
      <h1 class="page-title">Messages</h1>
      <p>Conversation avec vos soignants</p>
    </div>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    
    <div style="padding:16px 20px;border-bottom:1px solid var(--border-color);font-weight:600;">
      Fil de discussion
    </div>

    <!-- CHAT -->
    <div class="chat-container">

      <div *ngFor="let msg of messages" 
           class="msg" 
           [ngClass]="msg.from === 'Moi' ? 'me' : 'other'">

        <div class="bubble">
          <div class="sender">{{ msg.from }}</div>
          <div class="text">{{ msg.text }}</div>
        </div>

      </div>

    </div>

    <!-- INPUT -->
    <div class="input-box">
      <input [(ngModel)]="newMsg" placeholder="Écrire un message..." />
      
      <button class="btn btn-primary" 
              (click)="send()" 
              [disabled]="!newMsg.trim()">
        Envoyer
      </button>
    </div>

  </div>
</div>
