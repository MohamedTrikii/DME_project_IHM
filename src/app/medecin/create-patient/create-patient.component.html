<div class="page fade-in">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Nouveau Patient</h1>
      <p>Un DME est créé automatiquement à l'enregistrement</p>
    </div>
    <button class="btn btn-outline" routerLink="/medecin/patients">
      <span class="material-icons">arrow_back</span> Retour
    </button>
  </div>

  <!-- Alerts -->
  <div class="alert alert-danger" *ngIf="errorMsg" style="margin-bottom:20px;">
    <span class="material-icons">error</span> {{ errorMsg }}
  </div>
  <div class="alert alert-success" *ngIf="successMsg" style="margin-bottom:20px;">
    <span class="material-icons">check_circle</span> {{ successMsg }}
  </div>

  <div class="card" style="max-width:700px;">
    <div class="section-title">Informations personnelles</div>

    <form (ngSubmit)="save()" #f="ngForm">
      <!-- Nom / Prénom -->
      <div class="grid-2" style="gap:16px; margin-bottom:0;">
        <div class="form-group">
          <label for="nom">Nom *</label>
          <input id="nom" [(ngModel)]="patient.nom" name="nom"
                 placeholder="Nom de famille" required>
        </div>
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input id="prenom" [(ngModel)]="patient.prenom" name="prenom"
                 placeholder="Prénom" required>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input id="email" type="email" [(ngModel)]="patient.email" name="email"
               placeholder="patient@exemple.com" required>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="mdp">Mot de passe *</label>
        <input id="mdp" type="password" [(ngModel)]="patient.mot_de_passe" name="mot_de_passe"
               placeholder="Minimum 6 caractères" required>
      </div>

      <!-- Date de naissance / Téléphone -->
      <div class="grid-2" style="gap:16px; margin-bottom:0;">
        <div class="form-group">
          <label for="dateNais">Date de naissance</label>
          <input id="dateNais" type="date" [(ngModel)]="patient.dateNais" name="dateNais">
        </div>
        <div class="form-group">
          <label for="tel">Téléphone</label>
          <input id="tel" [(ngModel)]="patient.telephone" name="telephone"
                 placeholder="0X XX XX XX XX">
        </div>
      </div>

      <!-- Adresse -->
      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input id="adresse" [(ngModel)]="patient.adresse" name="adresse"
               placeholder="Adresse complète">
      </div>

      <!-- Info DME -->
      <div class="alert alert-info" style="margin-bottom:20px;">
        <span class="material-icons">info</span>
        Un Dossier Médical Électronique (DME) sera automatiquement créé et associé à ce patient.
      </div>

      <!-- Actions -->
      <div style="display:flex; gap:12px;">
        <button class="btn btn-primary" type="submit" [disabled]="isLoading || !f.valid">
          <span class="material-icons" *ngIf="!isLoading">person_add</span>
          <span *ngIf="isLoading" class="spinner-inline"></span>
          {{ isLoading ? 'Enregistrement...' : 'Créer patient + DME' }}
        </button>
        <button class="btn btn-outline" type="button" routerLink="/medecin/patients">
          Annuler
        </button>
      </div>
    </form>
  </div>

</div>
