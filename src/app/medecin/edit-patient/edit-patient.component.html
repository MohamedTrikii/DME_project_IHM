<div class="page fade-in">

  <div class="page-header">
    <div>
      <h1 class="page-title">Modifier Patient</h1>
      <p>Mise à jour des informations du patient</p>
    </div>
    <a class="btn btn-outline btn-sm" routerLink="/medecin/patients">
      <span class="material-icons" style="font-size:16px">arrow_back</span> Retour
    </a>
  </div>

  <div class="card" style="max-width:660px;">

    <div class="alert alert-danger" *ngIf="errorMsg" style="margin-bottom:20px;">
      <span class="material-icons">error</span> {{ errorMsg }}
    </div>
    <div class="alert alert-success" *ngIf="successMsg" style="margin-bottom:20px;">
      <span class="material-icons">check_circle</span> {{ successMsg }}
    </div>

    <app-loading-spinner [isLoading]="isLoading" message="Chargement du patient..."></app-loading-spinner>

    <form (ngSubmit)="update()" #f="ngForm" *ngIf="!isLoading">
      <div class="grid-2">
        <div class="form-group">
          <label>Nom *</label>
          <input type="text" [(ngModel)]="patient.nom" name="nom" required placeholder="Nom de famille">
        </div>
        <div class="form-group">
          <label>Prénom *</label>
          <input type="text" [(ngModel)]="patient.prenom" name="prenom" required placeholder="Prénom">
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="patient.email" name="email" required placeholder="email@exemple.com">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Date de naissance</label>
          <input type="date" [(ngModel)]="patient.dateNais" name="dateNais">
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" [(ngModel)]="patient.telephone" name="telephone" placeholder="0X XX XX XX XX">
        </div>
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="patient.adresse" name="adresse" placeholder="Adresse complète">
      </div>

      <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:8px;">
        <a class="btn btn-outline" routerLink="/medecin/patients">Annuler</a>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading || !f.valid">
          <span class="spinner-inline" *ngIf="isLoading"></span>
          {{ isLoading ? 'En cours...' : 'Mettre à jour' }}
        </button>
      </div>
    </form>

  </div>
</div>
