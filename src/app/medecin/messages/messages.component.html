<div class="chat-page">

  <!-- LEFT: patients -->
  <div class="chat-sidebar">
    <div class="title">Patients</div>

    <div *ngFor="let p of patients"
         class="patient"
         (click)="selectPatient(p)"
         [class.active]="selectedPatient?._id === p._id">

      {{ p.nom }} {{ p.prenom }}
    </div>
  </div>

  <!-- RIGHT: chat -->
  <div class="chat-main" *ngIf="selectedPatient">

    <div class="chat-header">
      Conversation avec {{ selectedPatient.nom }}
    </div>

    <div class="chat-container">

      <div *ngFor="let msg of messages"
           class="msg"
           [ngClass]="msg.from === userId ? 'me' : 'other'">

        <div class="bubble">
          <div class="text">{{ msg.text }}</div>
        </div>

      </div>

    </div>

    <div class="input-box">
      <input [(ngModel)]="newMsg" placeholder="Écrire..." />
      <button (click)="send()">Envoyer</button>
    </div>

  </div>

</div>
